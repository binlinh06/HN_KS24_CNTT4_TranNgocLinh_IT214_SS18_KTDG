## TODO Câu 1: Cấu hình nguồn lưu cấu hình (native/local hoặc git)
##   - Gợi ý native: đọc các file trong thư mục ../config-repo của project
##   - Gợi ý git   : trỏ tới một repository chứa các file cấu hình
server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # Trỏ tới thư mục config-repo nằm ngang hàng với thư mục config-server
          search-locations: C:\Users\MyPC\Downloads\base-project-dau-gio\config-repo

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

