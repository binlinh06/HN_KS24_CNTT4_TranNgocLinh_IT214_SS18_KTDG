## TODO Câu 1: Khai báo routes cho Gateway (dùng lb:// để có Load Balancing)
##   /api/order/**     -> order-service
##   /api/inventory/** -> inventory-service
##   /api/payment/**   -> payment-service
##
## TODO Câu 1: Đăng ký vào Eureka
##   eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Route sang order-service
        - id: order-service-route
          uri: lb://order-service
          predicates:
            - Path=/api/order/**

        # Route sang inventory-service
        - id: inventory-service-route
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**

        # Route sang payment-service
        - id: payment-service-route
          uri: lb://payment-service
          predicates:
            - Path=/api/payment/**

# Cấu hình Eureka Client kết nối tới Eureka Server
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/