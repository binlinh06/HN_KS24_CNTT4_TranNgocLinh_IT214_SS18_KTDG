# CẤU HÌNH DÙNG CHUNG CHO TẤT CẢ SERVICE (được Config Server phân phát)
# ======================================================================

# TODO Câu 1: Đăng ký Discovery Client Eureka dùng chung
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  # Cấu hình encoding & format JSON dùng chung
  jackson:
    serialization:
      indent-output: true

  # TODO Câu 3: Cấu hình Kafka Bootstrap Servers dùng chung
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  # TODO Câu 4: Cấu hình Redis dùng chung cho caching
  data:
    redis:
      host: localhost
      port: 6379

# TODO Câu 5: Logging SLF4J chuẩn cho hệ thống Microservices
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.shopmart: DEBUG
    org.springframework.web: INFO
    org.springframework.cloud: INFO
    org.apache.kafka: WARN